<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毕业论文格式审核</title>
<style>
  :root { --fail:#b00020; --undetermined:#8a5300; --unrecognised:#555; --line:#e3e3e3; --accent:#1f5fbf; }
  * { box-sizing: border-box; }
  body { margin:0; padding:0 1rem 4rem; color:#222; line-height:1.6;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width:52rem; margin:0 auto; }
  h1 { font-size:1.5rem; margin:1.6rem 0 .4rem; }
  h2 { font-size:1.2rem; margin:1.8rem 0 .6rem; border-left:5px solid #999; padding-left:.5rem; }
  h3 { font-size:1rem; margin:1.4rem 0 .5rem; }
  .lead { color:#444; }
  form { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin:1rem 0; }
  input[type=file] { flex:1 1 16rem; padding:.5rem; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { padding:.55rem 1.2rem; border:0; border-radius:6px; background:var(--accent); color:#fff;
    font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .status { padding:.7rem .9rem; border-radius:6px; background:#f2f5fb; border:1px solid #d5e0f5; }
  .status.error { background:#fdecec; border-color:#f5c6c6; color:var(--fail); }
  .cards { display:flex; gap:1rem; flex-wrap:wrap; margin:1rem 0; }
  .card { flex:1 1 8rem; border:1px solid var(--line); border-radius:8px; padding:.8rem 1rem; }
  .card .n { display:block; font-size:1.8rem; font-weight:700; }
  .card.fail .n { color:var(--fail); }
  .card.undetermined .n { color:var(--undetermined); }
  .card.unrecognised .n { color:var(--unrecognised); }
  .card .label { color:#555; font-size:.9rem; }
  .hint { color:#555; font-size:.9rem; }
  table { border-collapse:collapse; width:100%; font-size:.9rem; margin-top:.5rem; }
  th, td { border:1px solid var(--line); padding:.3rem .6rem; text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  ul { padding-left:1.2rem; }
  .downloads { display:flex; gap:.6rem; flex-wrap:wrap; }
  .downloads a { display:inline-block; padding:.55rem 1.1rem; border-radius:6px; border:1px solid var(--accent);
    color:var(--accent); text-decoration:none; }
  .downloads a:hover { background:#eef3fc; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>毕业论文格式审核</h1>
  <p class="lead">上传你的论文（.docx），系统会逐项检查格式是否符合学校规范，把问题写进文档批注，并给出问题清单和报告。</p>

  <form id="upload">
    <input id="file" name="file" type="file" accept=".docx" required>
    <button id="submit" type="submit">开始审核</button>
  </form>
  <p id="status" class="status" hidden></p>

  <section id="result" hidden>
    <h2>审核结果</h2>
    <div class="cards">
      <div class="card fail"><span class="n" id="n-fail">0</span><span class="label">不通过</span></div>
      <div class="card undetermined"><span class="n" id="n-undetermined">0</span><span class="label">无法判定</span></div>
      <div class="card unrecognised"><span class="n" id="n-unrecognised">0</span><span class="label">未识别结构</span></div>
    </div>
    <p class="hint">「不通过」是明确的格式问题；「无法判定」是信息不足、需要你确认的地方；
      「未识别结构」是工具没看懂、可能漏查的部分。后两类都不等于通过。</p>
    <p id="not-run" class="hint" hidden></p>

    <h3>按模块统计</h3>
    <table>
      <thead><tr><th>模块</th><th>不通过</th><th>无法判定</th><th>未执行</th><th>未识别</th></tr></thead>
      <tbody id="scope-body"></tbody>
    </table>

    <h3>本轮未覆盖项</h3>
    <ul id="uncovered"></ul>

    <h3>下载结果</h3>
    <div class="downloads">
      <a id="dl-issues" download>下载问题清单</a>
      <a id="dl-report" target="_blank" rel="noopener">查看审核报告</a>
      <a id="dl-marked" download>下载标注版文档</a>
    </div>
  </section>
</main>

<script>
  const form = document.getElementById('upload');
  const input = document.getElementById('file');
  const submit = document.getElementById('submit');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? 'status error' : 'status';
    statusEl.hidden = false;
  }

  function render(data) {
    const summary = data.summary || {};
    document.getElementById('n-fail').textContent = summary.fail ?? 0;
    document.getElementById('n-undetermined').textContent = summary.undetermined ?? 0;
    document.getElementById('n-unrecognised').textContent = summary.unrecognised ?? 0;

    const notRun = document.getElementById('not-run');
    if (summary.not_run) {
      notRun.textContent = '另有 ' + summary.not_run + ' 条规则本次未能执行，详见问题清单。';
      notRun.hidden = false;
    }

    const body = document.getElementById('scope-body');
    body.replaceChildren();
    const byScope = summary.by_scope || {};
    const scopes = Object.keys(byScope);
    if (!scopes.length) {
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = 5;
      cell.textContent = '没有需要按模块拆分的问题。';
      row.appendChild(cell);
      body.appendChild(row);
    } else {
      for (const scope of scopes) {
        const counts = byScope[scope];
        const row = document.createElement('tr');
        for (const value of [scope, counts.fail, counts.undetermined, counts.not_run, counts.unrecognised]) {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.appendChild(cell);
        }
        body.appendChild(row);
      }
    }

    const list = document.getElementById('uncovered');
    list.replaceChildren();
    for (const item of (data.uncovered || [])) {
      const li = document.createElement('li');
      li.textContent = item;
      list.appendChild(li);
    }

    const downloads = data.downloads || {};
    document.getElementById('dl-issues').href = downloads.issues;
    document.getElementById('dl-report').href = downloads.report;
    document.getElementById('dl-marked').href = downloads.marked;

    resultEl.hidden = false;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const file = input.files[0];
    if (!file) {
      setStatus('请先选择要上传的论文文件。', true);
      return;
    }
    resultEl.hidden = true;
    submit.disabled = true;
    setStatus('正在上传并审核，请稍候……', false);

    const body = new FormData();
    body.append('file', file);

    let response;
    try {
      response = await fetch('/api/review', { method: 'POST', body });
    } catch (err) {
      submit.disabled = false;
      setStatus('网络异常，请检查连接后重试。', true);
      return;
    }

    let data = {};
    try { data = await response.json(); } catch (err) { data = {}; }
    submit.disabled = false;

    if (!response.ok) {
      setStatus(data.error || '审核失败，请重试。', true);
      return;
    }
    statusEl.hidden = true;
    render(data);
  });
</script>
</body>
</html>
