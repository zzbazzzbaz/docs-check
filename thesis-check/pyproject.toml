[project]
name = "thesischeck"
version = "0.1.0"
description = "毕业论文格式自动审核"
requires-python = ">=3.14"
dependencies = [
    "lxml>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.18",
    "lxml-stubs>=0.5",
    "import-linter>=2.1",
]

[project.scripts]
thesis-check = "thesischeck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesischeck"]

[tool.uv]
package = true

# ── 代码规范 ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4"]
# RUF001~003 是"易混淆 Unicode"（把全角标点当可疑字符）——中文注释必然触发，对中文项目是反作用
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

# ── 类型 ─────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
all = "error"

# ── 测试 ─────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
