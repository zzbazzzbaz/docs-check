name: Build and publish images

on:
  push:
    branches: [main]

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-api:
    name: Build and publish API image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to private registry
        uses: docker/login-action@v4
        with:
          registry: docker.gqt.plus
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/zzbazzzbaz/docx-check-api:${{ github.sha }}
            ghcr.io/zzbazzzbaz/docx-check-api:latest
            docker.gqt.plus/docx-check/docx-check-api:${{ github.sha }}
            docker.gqt.plus/docx-check/docx-check-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
